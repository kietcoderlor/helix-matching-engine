services:
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    environment:
      HELIX_BIND: 0.0.0.0
      HELIX_PORT: 9001
    ports:
      - "9001:9001"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
      POSTGRES_DB: helix
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - helix_pg:/var/lib/postgresql/data

volumes:
  helix_pg:
